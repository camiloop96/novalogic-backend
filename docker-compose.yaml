version: "3.8"

services:

  postgres:
    container_name: novalogic-db
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    env_file:
      - .env
    ports:
      - 5440:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - novalogic-net

  pgadmin:
    container_name: novalogic-pgadmin
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    env_file:
      - .env
    ports:
      - 49152:80
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - novalogic-net

  redis:
    container_name: novalogic-redis
    image: redis:7-alpine
    restart: always
    ports:
      - 6380:6379
    volumes:
      - redis-data:/data
    networks:
      - novalogic-net

volumes:
  postgres-data:
  pgadmin-data:
  redis-data:

networks:
  novalogic-net:
    driver: bridge
